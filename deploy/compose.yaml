name: denso-arena
services:
  arena:
    image: ${DENSO_IMAGE:-denso-arena:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DENSO_COMMIT: ${DENSO_COMMIT:-unknown}
    platform: linux/amd64
    command: ["${ARENA_MODE:-idle}"]
    network_mode: host
    ipc: host
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,video,display
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ${DENSO_DATA_DIR:-/srv/denso}/datasets:/datasets
      - ${DENSO_DATA_DIR:-/srv/denso}/models:/models
      - ${DENSO_DATA_DIR:-/srv/denso}/eval:/eval
      - ${DENSO_DATA_DIR:-/srv/denso}/cache:/root/.cache
      - ${DENSO_DATA_DIR:-/srv/denso}/config:/root/.config
      - ${DENSO_DATA_DIR:-/srv/denso}/cloudxr:/root/.cloudxr
      - ${DENSO_DATA_DIR:-/srv/denso}/asset-cache:/tmp/https
      - ${DENSO_DATA_DIR:-/srv/denso}/logs:/root/.nvidia-omniverse/logs
      - ${DENSO_DATA_DIR:-/srv/denso}/kit-cache:/isaac-sim/kit/cache
      - ${DENSO_DATA_DIR:-/srv/denso}/ov-data:/root/.local/share/ov/data
      - ${DENSO_DATA_DIR:-/srv/denso}/compute-cache:/root/.nv/ComputeCache
